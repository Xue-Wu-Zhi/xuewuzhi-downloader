name: Public scaffold checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_public_tree.py
      - run: python -m unittest discover -s tests -v
      - run: python -m xuewuzhi_downloader demo
      - run: python -m xuewuzhi_downloader platforms --query MOOC
