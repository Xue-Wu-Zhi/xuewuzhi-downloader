<text x="48" y="62" font-size="34" fill="#183e64" font-weight="700" text-anchor="start">先选对入口，再开始下载</text><text x="50" y="102" font-size="19" fill="#526b82" font-weight="400" text-anchor="start">没有网址，从平台列表开始；已有课程地址，按教程进入对应流程。</text><circle cx="76" cy="185" r="20" fill="#2268a4"/><text x="76" y="192" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="110" y="193" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">从平台列表开始</text><circle cx="665" cy="185" r="20" fill="#2268a4"/><text x="665" y="192" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="699" y="193" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">已有课程地址</text><rect x="50" y="224" width="510" height="309" rx="12" fill="#ffffff" stroke="#d5e2ee"/><rect x="76" y="247" width="160" height="34" rx="17" fill="#e7f2fc" stroke="#e7f2fc"/><text x="156.0" y="270" font-size="17" fill="#2268a4" font-weight="600" text-anchor="middle">首页输入 A</text><text x="76" y="324" font-size="22" fill="#183e64" font-weight="600" text-anchor="start">按实际上课的平台选择入口</text><rect x="76" y="350" width="456" height="41" rx="6" fill="#e9f3ff" stroke="#e9f3ff"/><text x="93" y="378" font-size="20" fill="#183e64" font-weight="400" text-anchor="start">中国大学 MOOC</text><text x="509" y="378" font-size="25" fill="#2268a4" font-weight="400" text-anchor="end">›</text><rect x="76" y="399" width="456" height="41" rx="6" fill="#f5f8fc" stroke="#f5f8fc"/><text x="93" y="427" font-size="20" fill="#183e64" font-weight="400" text-anchor="start">超星学习通</text><text x="509" y="427" font-size="25" fill="#2268a4" font-weight="400" text-anchor="end">›</text><rect x="76" y="448" width="456" height="41" rx="6" fill="#f5f8fc" stroke="#f5f8fc"/><text x="93" y="476" font-size="20" fill="#183e64" font-weight="400" text-anchor="start">网易云课堂</text><text x="509" y="476" font-size="25" fill="#2268a4" font-weight="400" text-anchor="end">›</text><rect x="638" y="224" width="512" height="309" rx="12" fill="#ffffff" stroke="#d5e2ee"/><text x="664" y="272" font-size="22" fill="#183e64" font-weight="600" text-anchor="start">复制具体课程页或学习页地址</text><rect x="664" y="299" width="461" height="51" rx="6" fill="#f5f8fc" stroke="#d5e2ee"/><text x="682" y="331" font-size="19" fill="#526b82" font-weight="400" text-anchor="start">https://example.org/course/demo</text><path d="M895 367L895 395" fill="none" stroke="#6b8dac" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="740" y="416" width="313" height="34" rx="17" fill="#e7f2fc" stroke="#e7f2fc"/><text x="896.5" y="439" font-size="17" fill="#2268a4" font-weight="600" text-anchor="middle">按平台教程粘贴链接</text><text x="664" y="504" font-size="20" fill="#526b82" font-weight="400" text-anchor="start">保留课程信息，核对期次和账号</text><rect x="50" y="565" width="1100" height="48" rx="8" fill="#edf6fb" stroke="#edf6fb"/><text x="68" y="596" font-size="19" fill="#355e80" font-weight="400" text-anchor="start">两种入口选其一；具体平台使用哪一种，以对应教程和当前提示为准。</text>
