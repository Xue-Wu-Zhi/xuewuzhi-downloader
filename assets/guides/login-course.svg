<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">登录成功，还要确认课程身份</title><desc id="desc">课程平台账号决定可访问内容；下载器服务账号不能替代课程权限。。通用操作示意，非客户端截图。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6b8dac"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif}</style>
<rect width="1200" height="700" rx="16" fill="#f6faff"/>
<path d="M48 131H1152" stroke="#d5e2ee"/>
<text x="48" y="62" font-size="34" fill="#183e64" font-weight="700" text-anchor="start">登录成功，还要确认课程身份</text><text x="50" y="102" font-size="19" fill="#526b82" font-weight="400" text-anchor="start">课程平台账号决定可访问内容；下载器服务账号不能替代课程权限。</text><circle cx="77" cy="185" r="20" fill="#2268a4"/><text x="77" y="192" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="111" y="193" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">核对登录入口</text><circle cx="446" cy="185" r="20" fill="#2268a4"/><text x="446" y="192" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="480" y="193" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">使用上课账号</text><circle cx="824" cy="185" r="20" fill="#2268a4"/><text x="824" y="192" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="858" y="193" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">等待课程列表</text><rect x="50" y="228" width="350" height="141" rx="12" fill="#ffffff" stroke="#d5e2ee"/><rect x="421" y="228" width="350" height="141" rx="12" fill="#ffffff" stroke="#d5e2ee"/><rect x="800" y="228" width="350" height="141" rx="12" fill="#ffffff" stroke="#d5e2ee"/><text x="78" y="277" font-size="25" fill="#183e64" font-weight="600" text-anchor="start">平台 / 产品线</text><text x="78" y="320" font-size="20" fill="#526b82" font-weight="400" text-anchor="start">PC、App、企业版要对应</text><text x="447" y="277" font-size="25" fill="#183e64" font-weight="600" text-anchor="start">自己的课程账号</text><text x="447" y="320" font-size="20" fill="#526b82" font-weight="400" text-anchor="start">按原平台要求完成验证</text><text x="826" y="277" font-size="25" fill="#183e64" font-weight="600" text-anchor="start">核对课程名称</text><text x="826" y="320" font-size="20" fill="#526b82" font-weight="400" text-anchor="start">检查班级、企业与期次</text><path d="M401 298L419 298" fill="none" stroke="#6b8dac" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M773 298L797 298" fill="none" stroke="#6b8dac" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="412" width="1100" height="169" rx="12" fill="#fff5e5" stroke="#eddbb9"/><text x="78" y="454" font-size="25" fill="#765623" font-weight="600" text-anchor="start">列表为空时，先检查这些地方</text><text x="79" y="500" font-size="21" fill="#765623" font-weight="400" text-anchor="start">① 是否登录了同一个账号</text><text x="615" y="500" font-size="21" fill="#765623" font-weight="400" text-anchor="start">② 是否选对实际上课的产品入口</text><text x="79" y="544" font-size="21" fill="#765623" font-weight="400" text-anchor="start">③ 原平台能否打开课程</text><text x="615" y="544" font-size="21" fill="#765623" font-weight="400" text-anchor="start">④ 是否在正确班级、企业和有效期内</text>
<path d="M48 646H1152" stroke="#d5e2ee"/>
<text x="50" y="677" font-size="17" fill="#526b82" font-weight="400" text-anchor="start">学无止下载器 · 操作图解</text><text x="1150" y="677" font-size="16" fill="#526b82" font-weight="400" text-anchor="end">虚构示例 / 非客户端截图 / 以当前界面为准</text>
</svg>
