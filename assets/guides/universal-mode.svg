<text x="48" y="62" font-size="34" fill="#183e64" font-weight="700" text-anchor="start">先播放，再检查识别到的内容</text><text x="50" y="102" font-size="19" fill="#526b82" font-weight="400" text-anchor="start">适用于实际加载且当前版本能够处理的资源，不保证识别所有网站或课程。</text><rect x="50" y="180" width="334" height="227" rx="12" fill="#ffffff" stroke="#d5e2ee"/><circle cx="82" cy="219" r="20" fill="#2268a4"/><text x="82" y="226" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="116" y="227" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">启动资源识别</text><text x="74" y="374" font-size="19" fill="#526b82" font-weight="400" text-anchor="start">在客户端选择万能下载模式</text><rect x="127" y="269" width="180" height="48" rx="8" fill="#e7f2fc" stroke="#e7f2fc"/><text x="217" y="301" font-size="22" fill="#2268a4" font-weight="600" text-anchor="middle">开始识别</text><path d="M391 292L424 292" fill="none" stroke="#6b8dac" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="432" y="180" width="334" height="227" rx="12" fill="#ffffff" stroke="#d5e2ee"/><circle cx="464" cy="219" r="20" fill="#2268a4"/><text x="464" y="226" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="498" y="227" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">打开课程并播放</text><text x="456" y="374" font-size="19" fill="#526b82" font-weight="400" text-anchor="start">使用自己的浏览器或客户端</text><rect x="519" y="258" width="160" height="75" rx="8" fill="#dceafa" stroke="#dceafa"/><path d="M588 278l29 18-29 18Z" fill="#2268a4"/><path d="M773 292L806 292" fill="none" stroke="#6b8dac" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="814" y="180" width="334" height="227" rx="12" fill="#ffffff" stroke="#d5e2ee"/><circle cx="846" cy="219" r="20" fill="#2268a4"/><text x="846" y="226" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="880" y="227" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">核对资源后保存</text><text 