<text x="50" y="677" font-size="17" fill="#526b82" font-weight="400" text-anchor="start">学无止下载器 · 操作图解</text><text x="1150" y="677" font-size="16" fill="#526b82" font-weight="400" text-anchor="end">虚构示例 / 非客户端截图 / 以当前界面为准</text>
