<text x="48" y="62" font-size="34" fill="#183e64" font-weight="700" text-anchor="start">把需要的章节与资料选清楚</text><text x="50" y="102" font-size="19" fill="#526b82" font-weight="400" text-anchor="start">课程名称、开课期次、章节范围和内容类型，分别核对。</text><circle cx="77" cy="183" r="20" fill="#2268a4"/><text x="77" y="190" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="111" y="191" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">选择课程与章节</text><circle cx="664" cy="183" r="20" fill="#2268a4"/><text x="664" y="190" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="698" y="191" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">选择可用内容</text><rect x="50" y="224" width="510" height="310" rx="12" fill="#ffffff" stroke="#d5e2ee"/><text x="78" y="266" font-size="23" fill="#183e64" font-weight="600" text-anchor="start">示例课程 · 学习方法入门</text><rect x="81" y="301" width="24" height="24" rx="5" fill="#2268a4" stroke="#2268a4"/><path d="M86 312l5 5 9-11" fill="none" stroke="white" stroke-width="2.5"/><text x="125" y="323" font-size="23" fill="#183e64" font-weight="400" text-anchor="start">01 建立学习计划</text><rect x="81" y="359" width="24" height="24" rx="5" fill="#2268a4" stroke="#2268a4"/><path d="M86 370l5 5 9-11" fill="none" stroke="white" stroke-width="2.5"/><text x="125" y="381" font-size="23" fill="#183e64" font-weight="400" text-anchor="start">02 回顾与复习</text><rect x="81" y="417" width="24" height="24" rx="5" fill="#ffffff" stroke="#91a7bb"/><text x="125" y="439" font-size="23" fill="#183e64" font-weight="400" text-anchor="start">03 扩展练习</text><text x="81" y="502" font-size="19" fill="#526b82" font-weight="400" text-anchor="start">先试一个课节，确认内容与期次</text><rect x="638" y="224" width="512" height="310" rx="12" fill="#ffffff" stroke="#d5e2ee"/><rect x="669" y="260" width="24" height="24" rx="5" fill="#2268a4" stroke="#2268a4"/><path d="M674 271l5 5 9-11" fill="none" stroke="white" stroke-width="2.5"/><text x="710" y="283" font-size="23" fill="#183e64" font-weight="400" text-anchor="start">视频 / 录播</text><rect x="669" y="315" width="24" height="24" rx="5" fill="#2268a4" stroke="#2268a4"/><path d="M674 326l5 5 9-11" fill="none" stroke="white" stroke-width="2.5"/><text x="710" y="338" font-size="23" fill="#183e64" font-weight="400" text-anchor="start">课件 / 附件</text><rect x="669" y="370" width="24" height="24" rx="5" fill="#ffffff" stroke="#91a7bb"/><text x="710" y="393" font-size="23" fill="#183e64" font-weight="400" text-anchor="start">音频（课程提供时）</text><path d="M664 444L1125 444" fill="none" stroke="#d5e2ee" stroke-width="2"/><text x="669" y="480" font-size="21" fill="#183e64" font-weight="600" text-anchor="start">确认保存位置</text><text x="669" y="514" font-size="19" fill="#526b82" font-weight="400" text-anchor="start">示例目录：我的学习资料</text><rect x="50" y="565" width="1100" height="48" rx="8" fill="#edf6fb" stroke="#edf6fb"/><text x="68" y="596" font-size="19" fill="#355e80" font-weight="400" text-anchor="start">资源选项以当前入口为准；勾选“全部”不会获得尚未开放或无权限的内容。</text>
