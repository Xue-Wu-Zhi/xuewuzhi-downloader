<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">把需要的章节与资料选清楚</title><desc id="desc">课程名称、开课期次、章节范围和内容类型，分别核对。。通用操作示意，非客户端截图。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6b8dac"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif}</style>
