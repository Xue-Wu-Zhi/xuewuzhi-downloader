<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">视频之外，把讲义也整理好</title><desc id="desc">确认课程提供附件，再选择客户端当前可用的资料选项。。通用操作示意，非客户端截图。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6b8dac"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif}</style>
<rect width="1200" height="700" rx="16" fill="#f6faff"/>
<path d="M48 131H1152" stroke="#d5e2ee"/>
<text x="48" y="62" font-size="34" fill="#183e64" font-weight="700" text-anchor="start">视频之外，把讲义也整理好</text><text x="50" y="102" font-size="19" fill="#526b82" font-weight="400" text-anchor="start">确认课程提供附件，再选择客户端当前可用的资料选项。</text><rect x="90" y="181" width="278" height="241" rx="12" fill="#ffffff" stroke="#d5e2ee"/><rect x="169" y="209" width="120" height="141" rx="8" fill="#fff1ec" stroke="#fff1ec"/><text x="229" y="287" font-size="34" fill="#a65242" font-weight="700" text-anchor="middle">PDF</text><text x="229" y="387" font-size="24" fill="#183e64" font-weight="600" text-anchor="middle">随课讲义</text><rect x="461" y="181" width="278" height="241" rx="12" fill="#ffffff" stroke="#d5e2ee"/><rect x="540" y="209" width="120" height="141" rx="8" fill="#fff4dd" stroke="#fff4dd"/><text x="600" y="287" font-size="34" fill="#986820" font-weight="700" text-anchor="middle">PPT</text><text x="600" y="387" font-size="24" fill="#183e64" font-weight="600" text-anchor="middle">课程演示稿</text><rect x="832" y="181" width="278" height="241" rx="12" fill="#ffffff" stroke="#d5e2ee"/><rect x="911" y="209" width="120" height="141" rx="8" fill="#eaf4ff" stroke="#eaf4ff"/><text x="971" y="287" font-size="34" fill="#246596" font-weight="700" text-anchor="middle">DOC</text><text x="971" y="387" font-size="24" fill="#183e64" font-weight="600" text-anchor="middle">文档与附件</text><circle cx="78" cy="485" r="20" fill="#2268a4"/><text x="78" y="492" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="112" y="493" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">原平台有资料</text><circle cx="463" cy="485" r="20" fill="#2268a4"/><text x="463" y="492" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="497" y="493" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">选择相应类型</text><circle cx="844" cy="485" r="20" fill="#2268a4"/><text x="844" y="492" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="878" y="493" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">检查能否打开</text><rect x="50" y="563" width="1100" height="48" rx="8" fill="#edf6fb" stroke="#edf6fb"/><text x="68" y="594" font-size="19" fill="#355e80" font-weight="400" text-anchor="start">课件是否存在、是什么格式，以原课程提供的资源为准；并非每个课节都有附件。</text>
<path d="M48 646H1152" stroke="#d5e2ee"/>
<text x="50" y="677" font-size="17" fill="#526b82" font-weight="400" text-anchor="start">学无止下载器 · 操作图解</text><text x="1150" y="677" font-size="16" fill="#526b82" font-weight="400" text-anchor="end">虚构示例 / 非客户端截图 / 以当前界面为准</text>
</svg>
