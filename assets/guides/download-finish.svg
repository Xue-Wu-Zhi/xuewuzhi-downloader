<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">下载进度结束，再确认处理完成</title><desc id="desc">看到合并、板书或转换提示时继续等待，最后到输出目录检查。。通用操作示意，非客户端截图。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6b8dac"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif}</style>
<rect width="1200" height="700" rx="16" fill="#f6faff"/>
<path d="M48 131H1152" stroke="#d5e2ee"/>
<text x="48" y="62" font-size="34" fill="#183e64" font-weight="700" text-anchor="start">下载进度结束，再确认处理完成</text><text x="50" y="102" font-size="19" fill="#526b82" font-weight="400" text-anchor="start">看到合并、板书或转换提示时继续等待，最后到输出目录检查。</text><rect x="50" y="171" width="334" height="94" rx="12" fill="#ffffff" stroke="#d5e2ee"/><circle cx="82" cy="203" r="20" fill="#2268a4"/><text x="82" y="210" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="116" y="211" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">获取课程文件</text><text x="117" y="245" font-size="18" fill="#526b82" font-weight="400" text-anchor="start">视频、音频和附件</text><path d="M390 218L425 218" fill="none" stroke="#6b8dac" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="433" y="171" width="334" height="94" rx="12" fill="#ffffff" stroke="#d5e2ee"/><circle cx="465" cy="203" r="20" fill="#2268a4"/><text x="465" y="210" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="499" y="211" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">合并 / 转换</text><text x="500" y="245" font-size="18" fill="#526b82" font-weight="400" text-anchor="start">部分课程还需处理</text><path d="M773 218L808 218" fill="none" stroke="#6b8dac" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="816" y="171" width="334" height="94" rx="12" fill="#ffffff" stroke="#d5e2ee"/><circle cx="848" cy="203" r="20" fill="#2268a4"/><text x="848" y="210" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="882" y="211" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">完成后检查</text><text x="883" y="245" font-size="18" fill="#526b82" font-weight="400" text-anchor="start">播放抽查与课件核对</text><rect x="50" y="304" width="639" height="286" rx="12" fill="#ffffff" stroke="#d5e2ee"/><text x="78" y="350" font-size="24" fill="#183e64" font-weight="600" text-anchor="start">示例课程 /</text><text x="94" y="397" font-size="22" fill="#183e64" font-weight="400" text-anchor="start">01 建立学习计划 /</text><text x="94" y="440" font-size="22" fill="#526b82" font-weight="400" text-anchor="start">    01 学习目标.mp4</text><text x="94" y="483" font-size="22" fill="#526b82" font-weight="400" text-anchor="start">    02 随课讲义.pdf</text><text x="94" y="526" font-size="22" fill="#183e64" font-weight="400" text-anchor="start">02 回顾与复习 /</text><rect x="726" y="304" width="424" height="286" rx="12" fill="#ffffff" stroke="#d5e2ee"/><text x="753" y="350" font-size="25" fill="#183e64" font-weight="600" text-anchor="start">检查结果</text><rect x="754" y="389" width="24" height="24" rx="5" fill="#2268a4" stroke="#2268a4"/><path d="M759 400l5 5 9-11" fill="none" stroke="white" stroke-width="2.5"/><text x="791" y="411" font-size="21" fill="#183e64" font-weight="400" text-anchor="start">视频：开头、中段、结尾</text><rect x="754" y="452" width="24" height="24" rx="5" fill="#2268a4" stroke="#2268a4"/><path d="M759 463l5 5 9-11" fill="none" stroke="white" stroke-width="2.5"/><text x="791" y="474" font-size="21" fill="#183e64" font-weight="400" text-anchor="start">文档：能否正常打开</text><rect x="754" y="515" width="24" height="24" rx="5" fill="#2268a4" stroke="#2268a4"/><path d="M759 526l5 5 9-11" fill="none" stroke="white" stroke-width="2.5"/><text x="791" y="537" font-size="21" fill="#183e64" font-weight="400" text-anchor="start">数量：与已选内容对照</text>
