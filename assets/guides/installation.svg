<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">先下载对的文件</title><desc id="desc">从官方 Release 或官网获取 Windows 客户端，并按版本说明校验。。通用操作示意，非客户端截图。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6b8dac"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif}</style>
<rect width="1200" height="700" rx="16" fill="#f6faff"/>
<path d="M48 131H1152" stroke="#d5e2ee"/>
<text x="48" y="62" font-size="34" fill="#183e64" font-weight="700" text-anchor="start">先下载对的文件</text><text x="50" y="102" font-size="19" fill="#526b82" font-weight="400" text-anchor="start">从官方 Release 或官网获取 Windows 客户端，并按版本说明校验。</text><circle cx="77" cy="183" r="20" fill="#2268a4"/><text x="77" y="190" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="111" y="191" font-size="25" fill="#183e64" font-weight="700" text-anchor="start">打开官方发布页面</text><rect x="50" y="224" width="690" height="291" rx="12" fill="#ffffff" stroke="#d5e2ee"/><text x="77" y="267" font-size="24" fill="#183e64" font-weight="600" text-anchor="start">Release 附件</text><rect x="77" y="292" width="638" height="58" rx="8" fill="#e7f2fc" stroke="#abc9e5"/><text x="95" y="328" font-size="24" fill="#2268a4" font-weight="600" text-anchor="start">xuewuzhi-downloader-…-windows.exe</text><rect x="77" y="364" width="638" height="49" rx="8" fill="#f5f8fc" stroke="#f5f8fc"/><text x="95" y="396" font-size="22" fill="#526b82" font-weight="400" text-anchor="start">SHA256SUMS.txt</text><text x="80" y="466" font-size="21" fill="#526b82" font-weight="400" text-anchor="start">Source code 是公开骨架，不是完整客户端</text><rect x="783" y="224" width="367" height="291" rx="12" fill="#ffffff" stroke="#d5e2ee"/><text x="810" y="269" font-size="25" fill="#183e64" font-weight="600" text-anchor="start">下载后检查</text><rect x="810" y="308" width="24" height="24" rx="5" fill="#2268a4" stroke="#2268a4"/><path d="M815 319l5 5 9-11" fill="none" stroke="white" stroke-width="2.5"/><text x="850" y="330" font-size="21" fill="#183e64" font-weight="400" text-anchor="start">文件下载完整</text><rect x="810" y="369" width="24" height="24" rx="5" fill="#2268a4" stroke="#2268a4"/><path d="M815 380l5 5 9-11" fill="none" stroke="white" stroke-width="2.5"/><text x="850" y="391" font-size="21" fill="#183e64" font-weight="400" text-anchor="start">SHA-256 一致</text><rect x="810" y="430" width="24" height="24" rx="5" fill="#2268a4" stroke="#2268a4"/><path d="M815 441l5 5 9-11" fill="none" stroke="white" stroke-width="2.5"/><text x="850" y="452" font-size="21" fill="#183e64" font-weight="400" text-anchor="start">数字签名与发布者</text><rect x="50" y="562" width="1100" height="48" rx="8" fill="#edf6fb" stroke="#edf6fb"/><text x="68" y="593" font-size="19" fill="#355e80" font-weight="400" text-anchor="start">运行客户端后，先用一门短课程确认入口、账号和结果，再增加任务范围。</text>
<path d="M48 646H1152" stroke="#d5e2ee"/>
<text x="50" y="677" font-size="17" fill="#526b82" font-weight="400" text-anchor="start">学无止下载器 · 操作图解</text><text x="1150" y="677" font-size="16" fill="#526b82" font-weight="400" text-anchor="end">虚构示例 / 非客户端截图 / 以当前界面为准</text>
</svg>
